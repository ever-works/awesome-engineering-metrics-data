markdown: >-
  ## Overview


  Haystack is an engineering intelligence platform designed for product
  engineering teams to improve the lifecycle of planning, executing, and
  reporting deliverables. It sits on top of Git and JIRA to provide visibility
  into engineering operations.


  ## Key Features


  - **Operational Metrics**: Track and report on engineering performance metrics

  - **Team Health Report**: Identify team members who need help

  - **Risks Alerts**: Catch risk before it's too late

  - **Effective Standups**: Get status updates quickly

  - **Flexible Metrics**: Report progress across Git and JIRA

  - **Epics**: Track roadmap progress and understand capacity

  - **AI Release Notes**: Streamline communication with teams outside your
  engineering organization

  - **Retrospective**: Understand why you missed your sprint goals

  - **Alerts**: Identify blockers and understand progress

  - **Investments Visibility**: See where you spend time and understand capacity


  ## Integrations


  - Git

  - JIRA


  ## Pricing Model


  Free trial available ("Start free trial" indicated on website). Pricing
  details require contacting the vendor or signing up for a trial.


  ## Deployment


  Cloud-based SaaS platform that integrates with existing Git and JIRA
  instances.
