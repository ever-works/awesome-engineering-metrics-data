markdown: >-
  # DX - Engineering Intelligence Platform


  ## Overview


  DX is an engineering intelligence platform designed by researchers that
  provides R&D leaders with a common picture of the delivery lifecycle across
  engineering, product, and design. The platform delivers insights on where to
  invest and the impact AI is having on software delivery.


  ## DX Products


  ### AI Measurement

  Track AI-generated code by commit, PR, team, agent, and repo to understand
  AI's real impact on productivity.


  ### AI Enablement

  Build the context layer AI agents need to do their work safely and with
  precision.


  ### Developer Experience

  See how developers work and where they get stuck to reduce friction and boost
  satisfaction.


  ### Engineering Productivity

  Measure output, find bottlenecks, and align engineering with business goals.


  ### DX AI

  More than a dashboard, DX AI continuously delivers insights and flags risks
  automatically through an AI Copilot that guides teams on their next move.


  ## Pricing


  Pricing information is not publicly available. Contact DX for a demo and
  pricing details.


  ## Deployment


  Cloud-based platform.


  ## Integrations


  Integration details are not specified on the homepage.
